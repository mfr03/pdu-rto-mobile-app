name: pdu_mobile_rto_app
description: "Mobile RTO App for PDU Company"

publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.6.0

# ---- PACKAGES ---- #

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # chart
  syncfusion_flutter_charts: ^28.2.9

  # database
  hive_ce: ^2.10.1

  # Utility
  http: ^1.3.0
  logger: ^2.5.0
  intl: ^0.20.2

  # State Management
  get: ^4.7.2
  get_storage: ^2.1.1

  #dependency injection
  get_it: ^8.0.3
  
# ---- PACKAGES ---- #


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

fonts:
  - family: Montserrat
    fonts:
      - asset: assets/fonts/Montserrat-Regular.tff
      - asset: assets/fonts/Montserrat-Bold.ttf
      - asset: assets/fonts/Montserrat-SemiBold.ttf
      - asset: assets/fonts/Montserrat-Medium.ttf


assets:
  - assets/images/

  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
