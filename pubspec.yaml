name: pdu_mobile_rto_app
description: "Mobile RTO App for PDU Company"

publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.6.0

# ---- PACKAGES ---- #

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # chart
  syncfusion_flutter_charts: ^28.2.9

  # database
  hive_ce: ^2.10.1
  build_runner: ^2.4.6
  hive_ce_generator: ^1.8.2
  path_provider: ^2.1.1
  shared_preferences: ^2.5.3

  # Utility
  http: ^1.3.0
  logger: ^2.5.0
  intl: ^0.19.0
  flutter_colorpicker: ^1.0.3
  flutter_svg: ^2.0.17
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  flutter_secure_storage: ^9.0.0
  fluttertoast: ^8.2.8

  # State Management
  get: ^4.7.2
  get_storage: ^2.1.1

  #dependency injection
  get_it: ^8.0.3

  #noticication
  flutter_local_notifications: ^17.1.0
  flutter_background_service: ^5.1.0

  # firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4

  jwt_decode: ^0.3.1

# ---- PACKAGES ---- #


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/image_home.png
    - assets/images/bit_depth.svg

  generate: true

flutter_intl:
  enabled: true
