name: pdu_mobile_rto_app
description: "Mobile RTO App for PDU Company"

publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.6.0

# ---- PACKAGES ---- #

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # chart
  syncfusion_flutter_charts: ^28.2.9

  # database
  hive_ce: ^2.10.1
  build_runner: ^2.4.6
  hive_ce_generator: ^1.8.2
  path_provider: ^2.1.1

  # Utility
  http: ^1.3.0
  logger: ^2.5.0
  intl: ^0.20.2
  flutter_colorpicker: ^1.0.3
  flutter_svg: ^2.0.17

  # State Management
  get: ^4.7.2
  get_storage: ^2.1.1

  #dependency injection
  get_it: ^8.0.3
  
# ---- PACKAGES ---- #


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/image_home.png
    - assets/images/bit_depth.svg

